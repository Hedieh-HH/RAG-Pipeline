name: Tests

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    env:
      # Secrets — sensitive values stored encrypted in GitHub
      BLOB__CONNECTION_STRING: ${{ secrets.BLOB__CONNECTION_STRING }}
      BLOB__CONTAINER_NAME: ${{ secrets.BLOB__CONTAINER_NAME }}
      DOC_INTELLIGENCE__ENDPOINT: ${{ secrets.DOC_INTELLIGENCE__ENDPOINT }}
      DOC_INTELLIGENCE__API_KEY: ${{ secrets.DOC_INTELLIGENCE__API_KEY }}
      OPENAI__ENDPOINT: ${{ secrets.OPENAI__ENDPOINT }}
      OPENAI__API_KEY: ${{ secrets.OPENAI__API_KEY }}

      # Variables — non-sensitive config stored in GitHub Variables
      OPENAI__API_VERSION: ${{ vars.OPENAI__API_VERSION }}
      OPENAI__EMBEDDING_DEPLOYMENT_NAME: ${{ vars.OPENAI__EMBEDDING_DEPLOYMENT_NAME }}
      OPENAI__EMBEDDING_DIMENSIONS: ${{ vars.OPENAI__EMBEDDING_DIMENSIONS }}
      OPENAI__EMBEDDING_BATCH_SIZE: ${{ vars.OPENAI__EMBEDDING_BATCH_SIZE }}
      QDRANT__COLLECTION_NAME: ${{ vars.QDRANT__COLLECTION_NAME }}
      MONGO__DATABASE: ${{ vars.MONGO__DATABASE }}
      MONGO__COLLECTION: ${{ vars.MONGO__COLLECTION }}

      # Hardcoded — fixed values in CI context
      QDRANT__URL: http://localhost:6333
      MONGO__URI: mongodb://localhost:27017
      LOCAL__PDF_DIR: /tmp/pdfs
      RUN_INTEGRATION: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Download spaCy model
        run: uv run python -m spacy download en_core_web_sm

      - name: Download PDFs from Azure Blob Storage
        run: |
          uv run python -c "
          from ragcore.config import get_settings
          from ragcore.storage.blob_client import BlobStorageClient

          s = get_settings()
          with BlobStorageClient(
              connection_string=s.blob.connection_string,
              container_name=s.blob.container_name,
              pdf_dir=s.local.pdf_dir,
          ) as client:
              docs = client.fetch_all()
              print(f'Downloaded {len(docs)} PDFs')
          "

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p "test_*.py" -v

      - name: List downloaded PDFs
        if: always()
        run: ls -la /tmp/pdfs || echo "Directory is empty or missing"
